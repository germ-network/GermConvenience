name: Android

on:
  push:
    # branches:
    #   - main
    paths-ignore:
      - "README.md"
      - "CODE_OF_CONDUCT.md"
      - ".editorconfig"
      - ".spi.yml"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux-android:
    name: Test Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: "Test Swift Package on Android"
        id: android
        uses: skiptools/swift-android-action@v2
        with:
          swift-version: "6.3"
      # The portable products must not link FoundationNetworking: only
      # GermConvenienceURLSession (and swift-http-types' HTTPTypesFoundation,
      # which it alone depends on) may. Built into a scratch directory of their
      # own so the objects scanned are exactly the portable closure. `--target`,
      # not `--product`: SwiftPM 6.3 rejects `--product` for a library product
      # and silently builds every target instead.
      - name: "Portable products do not link FoundationNetworking"
        run: |
          for target in GermConvenience GermConvenienceHTTP GermConvenienceMocks \
            GermHTTPSignature GermCBOR GermConvenienceUtilities \
            GermConvenienceCrypto GermConvenienceLogging; do
            ${{ steps.android.outputs.swift-build }} --scratch-path .build-portable --target "$target"
          done
          Scripts/scan-foundation-networking.sh .build-portable
      # Control: the scanner must flag the URLSession product, or a pass above
      # could just mean it is not seeing the autolink entry.
      - name: "Scanner detects FoundationNetworking in the URLSession product"
        run: |
          ${{ steps.android.outputs.swift-build }} --scratch-path .build-urlsession --target GermConvenienceURLSession
          Scripts/scan-foundation-networking.sh --expect .build-urlsession
